events {}

http {
    # Load balancer: istekleri üç API replikasına round-robin dağıtır.
    upstream api_backend {
        server api1:8080;
        server api2:8080;
        server api3:8080;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }
    }
}
